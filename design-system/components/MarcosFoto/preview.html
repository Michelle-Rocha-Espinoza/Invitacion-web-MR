<!-- @dsCard group="Ornamentos" height=640 subtitle="Marco dorado con orlas, arco de mármol y camafeo" -->
<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><style>html,body{margin:0;min-height:100%;background:var(--fondo)} .galeria{display:grid;grid-template-columns:1fr 1fr;gap:18px;width:100%;max-width:400px;align-items:end} .galeria>:first-child{grid-column:1/-1} figure{margin:0}</style></head>
<body>
<div class="mb-escena">
  <div class="galeria">
    <figure>
      <div class="mb-marco-dorado">
        <svg class="mb-orla mb-orla--ti" data-mb="orla" aria-hidden="true"></svg><svg class="mb-orla mb-orla--td" data-mb="orla" aria-hidden="true"></svg>
        <svg class="mb-orla mb-orla--bi" data-mb="orla" aria-hidden="true"></svg><svg class="mb-orla mb-orla--bd" data-mb="orla" aria-hidden="true"></svg>
        <div class="mb-marco-dorado__paspartu"><div class="mb-foto"><span class="mb-foto__txt">Foto horizontal</span></div></div>
      </div>
      <figcaption class="mb-pie-foto">Cómo nos conocimos</figcaption>
    </figure>
    <figure>
      <div class="mb-arco-foto"><div class="mb-foto"><span class="mb-foto__txt">Foto vertical</span></div></div>
      <figcaption class="mb-pie-foto">El compromiso</figcaption>
    </figure>
    <figure>
      <div class="mb-camafeo"><div class="mb-foto"><span class="mb-foto__txt">Retrato</span></div></div>
      <figcaption class="mb-pie-foto">Un recuerdo</figcaption>
    </figure>
  </div>
</div>
<script>MarmolBlonda.iniciar(document);</script>
</body>
</html>
